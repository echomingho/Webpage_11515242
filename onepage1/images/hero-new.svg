      <path d="M371 327c8-23 36-30 53-13 14-34 66-30 74 7 29-6 47 9 43 28H384c-18-1-20-15-13-22z" opacity=".72"/>
    </g>
    <path d="M92 467 224 360l96 78 142-171 126 161 107-124 129 141 109-126 175 152v160H92z" fill="#89aeb0"/>
    <path d="m92 484 147-119 82 65 142-176 124 174 98-112 128 149 104-133 191 157v128H92z" fill="#668e8d"/>
