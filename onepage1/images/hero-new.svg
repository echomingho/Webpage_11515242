<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">窗前的手沖咖啡日常</title>
  <desc id="desc">室內木桌與椅子靠著大窗，桌上有濾杯、咖啡壺和手沖壺；窗外是陽光、白雲與層疊山景。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#5aa9dd"/>
      <stop offset=".58" stop-color="#b9e2f3"/>
      <stop offset="1" stop-color="#f8e7c7"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#effaff" stop-opacity=".74"/>
      <stop offset=".42" stop-color="#c8e4e8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#6a9294" stop-opacity=".44"/>
    </linearGradient>
    <linearGradient id="wood" x2="0" y2="1">
      <stop stop-color="#b77b4d"/>
      <stop offset=".38" stop-color="#805034"/>
      <stop offset="1" stop-color="#432b22"/>
    </linearGradient>
    <linearGradient id="chairWood" x2="1" y2="1">
      <stop stop-color="#bd8a5c"/>
      <stop offset="1" stop-color="#67402d"/>
    </linearGradient>
    <linearGradient id="room" x2="0" y2="1">
      <stop stop-color="#332d24"/>
      <stop offset=".52" stop-color="#75604a"/>
      <stop offset="1" stop-color="#241e19"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#fff9d7" stop-opacity=".95"/>
      <stop offset=".2" stop-color="#fff2bd" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ffdfa0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11"/>
      <feOffset dy="13"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="window">
      <rect x="92" y="92" width="1016" height="590" rx="3"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#room)"/>
  <rect x="0" y="0" width="1200" height="70" fill="#211e19"/>
  <path d="M0 70h1200v30H0z" fill="#59432f"/>
  <rect x="68" y="68" width="1064" height="634" rx="9" fill="#211f1a"/>
  <rect x="82" y="82" width="1036" height="610" fill="#b29368"/>
  <g clip-path="url(#window)">
    <rect x="92" y="92" width="1016" height="590" fill="url(#sky)"/>
    <circle cx="887" cy="228" r="213" fill="url(#sunGlow)"/>
    <circle cx="887" cy="228" r="58" fill="#fff5cd"/>
    <path d="M95 273c118-29 182 15 263 3 86-13 153-34 243-10 84 22 138 2 235-9 91-10 176 26 270 5v186H95z" fill="#f4fbff" opacity=".25"/>
    <g fill="#fff" opacity=".86">
      <path d="M168 218c8-27 41-34 60-15 16-38 74-34 83 8 34-7 53 10 49 32H171c-20-1-22-17-3-25z"/>
      <path d="M477 165c11-32 51-40 74-17 19-46 88-40 99 10 39-8 63 12 58 38H481c-22-2-26-20-4-31z"/>
