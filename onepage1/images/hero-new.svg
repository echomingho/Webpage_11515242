    <path d="M92 520c146-42 241-7 359-26 130-22 243-5 353-23 103-17 202 4 304-19v230H92z" fill="#315b50"/>
    <g fill="#24483f" opacity=".72">
      <path d="m140 497 18-57 18 57h-10l20 56h-56l20-56z"/>
      <path d="m253 500 14-45 15 45h-9l17 49h-45l17-49z"/>
      <path d="m941 503 18-59 19 59h-11l20 57h-56l20-57z"/>
      <path d="m1031 499 13-42 14 42h-8l16 46h-42l16-46z"/>
    </g>
    <path d="M92 605c216-44 387-17 564-20 154-3 282-34 452-10v107H92z" fill="#a7aa7c" opacity=".45"/>
    <path d="M790 92 960 92 1108 682H945z" fill="#fff5d9" opacity=".12"/>
  </g>

  <rect x="82" y="82" width="1036" height="610" fill="none" stroke="#d8bf94" stroke-width="13"/>
  <path d="M431 89v601M786 89v601M89 379h1022" fill="none" stroke="#765f43" stroke-width="18"/>
  <path d="M440 96v584M795 96v584M98 388h1000" fill="none" stroke="#eedab2" stroke-opacity=".55" stroke-width="3"/>
  <rect x="50" y="686" width="1100" height="26" rx="3" fill="#d0ae79"/>
  <path d="M0 715h1200v185H0z" fill="#32271f"/>
  <path d="M0 723h1200v18H0z" fill="#806044"/>

  <g opacity=".35" filter="url(#soft)">
    <ellipse cx="636" cy="793" rx="502" ry="72" fill="#120f0d"/>
  </g>

  <!-- Chair -->
  <g filter="url(#shadow)">
    <path d="M127 495q0-20 20-20h151q20 0 20 20v174H127z" fill="url(#chairWood)" stroke="#432d22" stroke-width="12"/>
    <path d="M169 486v172M211 482v176M253 482v176M295 486v172" stroke="#d2a675" stroke-opacity=".75" stroke-width="8"/>
    <path d="M119 659h206l25 31H106z" fill="#9d704a" stroke="#432d22" stroke-width="9"/>
    <path d="m133 683-16 183m199-174 27 172" fill="none" stroke="#5c3a28" stroke-width="18"/>
    <path d="m160 694 8 176m127-172-2 174" fill="none" stroke="#a17751" stroke-width="7"/>
  </g>

  <!-- Table -->
  <path d="M338 646h892v39H338z" fill="#c18a59"/>
  <path d="M354 683h861l-48 217H401z" fill="url(#wood)"/>
  <path d="M379 695h815M391 735h793M400 781h773M408 832h757" fill="none" stroke="#d09a66" stroke-opacity=".26" stroke-width="4"/>
