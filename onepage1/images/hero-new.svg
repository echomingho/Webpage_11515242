    <circle cx="103" cy="4" r="12" fill="#dfd6c5" stroke="#56544d" stroke-width="5"/>
  </g>

  <!-- Dripper and glass coffee server -->
  <g transform="translate(540 486)" filter="url(#shadow)">
    <path d="M45 29h145l-28 116q-44 34-89 0z" fill="#d9e3df" fill-opacity=".92" stroke="#596d68" stroke-width="8"/>
    <path d="M60 47h115l-20 86q-39 27-76 0z" fill="#b98256" opacity=".42"/>
    <path d="M57 47h121M69 72h97M76 96h83" fill="none" stroke="#f5f4ec" stroke-width="5" opacity=".75"/>
    <path d="M104 145v31" stroke="#5c5143" stroke-width="10"/>
    <path d="M45 173h145" stroke="#5c5143" stroke-width="9" stroke-linecap="round"/>
    <path d="M78 184q3 58 39 66h42q34-8 37-66l-4-10H80z" fill="url(#glass)" stroke="#e4ede8" stroke-width="7"/>
    <path d="M89 217q47 12 94 0v23q-44 26-89 0z" fill="#75442d" opacity=".9"/>
    <path d="M102 198v38M167 198v38" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>
    <path d="M101 176q17-18 37 0" fill="none" stroke="#a5b9b3" stroke-width="5"/>
    <path d="M135 166c-20-24 16-31-3-54M164 163c-14-20 15-26 2-44" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Small coffee cup -->
  <g transform="translate(733 635)">
    <ellipse cx="58" cy="47" rx="54" ry="15" fill="#49342a"/>
    <path d="M15 10h79l-7 62q-32 21-65 0z" fill="#f2eee4" stroke="#9f927c" stroke-width="5"/>
    <path d="M94 24q39-8 27 28-7 18-31 14" fill="none" stroke="#e9e1d2" stroke-width="11"/>
    <ellipse cx="54" cy="12" rx="39" ry="9" fill="#4b2d20"/>
    <path d="M33 12q20-14 41 0-20 12-41 0" fill="#b27b4d"/>
  </g>

  <rect width="1200" height="900" fill="none" stroke="#211d18" stroke-width="28" opacity=".42"/>
</svg>
